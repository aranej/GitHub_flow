# Secret Scanning Configuration (2025)
# This file configures GitHub's native secret scanning features
# including push protection and custom patterns

# Push Protection Configuration
push-protection:
  # Enable push protection globally for this repository
  enabled: true

  # Allow bypass with custom reviewers
  bypass-allowed: true

  # Bypass configuration
  bypass:
    # Require approval from specific teams/users
    reviewers:
      - "security-team"
      - "infrastructure-team"

    # Maximum bypass duration (hours)
    expiration: 24

    # Require justification for bypass
    require-justification: true

    # Log bypass events for audit
    audit-logging: true

# Excluded Directories
# Patterns in these directories will not trigger secret scanning
# Useful for test fixtures, documentation with fake examples, etc.
excluded-directories:
  - "tests/**"
  - "test/**"
  - "spec/**"
  - "docs/**"
  - "__tests__/**"
  - "fixtures/**"
  - ".github/workflows/examples/**"
  - "examples/**"
  - "samples/**"

# Excluded Files
excluded-files:
  - "*.lock"
  - "*.sum"
  - "*.md"
  - "*.txt"
  - "*.json.example"
  - ".env.example"
  - ".env.sample"
  - "*.template"
  - "README*"

# Custom Secret Patterns
# Define organization-specific patterns for detection
custom-patterns:

  # Example: Internal API Key Pattern
  - name: "internal-api-key"
    description: "Internal API key pattern (INTERNAL_KEY_...)"
    pattern: "INTERNAL_KEY_[A-Za-z0-9]{32}"
    secret_group: 1
    # Validity checks (2025 feature)
    validity-checks:
      enabled: true
      # Method to validate (e.g., API call, pattern)
      method: "pattern-based"

  # Example: Custom Token Pattern
  - name: "custom-token"
    description: "Custom authentication token pattern"
    pattern: "custom_token_[A-Za-z0-9]{40}"
    secret_group: 1
    validity-checks:
      enabled: true
      method: "checksum"

  # Example: Internal Database URI
  - name: "internal-db-uri"
    description: "Internal database connection string"
    pattern: "postgres://[a-zA-Z0-9_]+:[a-zA-Z0-9_@.]+@internal-[a-zA-Z0-9-]+:\\d{4}/[a-zA-Z0-9_]+"
    secret_group: 2
    validity-checks:
      enabled: true

  # Example: Slack Webhook (if used internally)
  - name: "slack-webhook"
    description: "Slack webhook URL"
    pattern: "https://hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+"
    secret_group: 1
    validity-checks:
      enabled: true

# Provider-Specific Settings (2025 Enhanced)
# Configure detection for specific secret providers
providers:

  # GitHub Token Detection
  github:
    enabled: true
    validity-checks: true
    extended-metadata: true
    patterns:
      - "ghp_*"  # Personal access token
      - "ghu_*"  # User installation token
      - "ghs_*"  # Server-to-server token
      - "gho_*"  # OAuth token

  # AWS Secret Detection
  aws:
    enabled: true
    validity-checks: true
    patterns:
      - "AKIA[0-9A-Z]{16}"  # AWS Access Key ID

  # Google Cloud
  google:
    enabled: true
    validity-checks: true
    patterns:
      - "AIza[0-9A-Za-z\\-_]{35}"  # Google API key

  # Stripe
  stripe:
    enabled: true
    validity-checks: true
    patterns:
      - "sk_live_[A-Za-z0-9]{24,}"
      - "pk_live_[A-Za-z0-9]{24,}"

  # SendGrid
  sendgrid:
    enabled: true
    validity-checks: true
    pattern: "SG\\.[A-Za-z0-9_-]{22}\\.[A-Za-z0-9_-]{43}"

  # Slack
  slack:
    enabled: true
    validity-checks: true
    patterns:
      - "xox[bapru]-[0-9]+[a-zA-Z0-9-]*"
      - "https://hooks\\.slack\\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+"

  # Database Credentials
  database:
    enabled: true
    validity-checks: true
    patterns:
      - "mongodb\\+srv://[^:]+:[^@]+@"
      - "postgresql://[^:]+:[^@]+@"
      - "mysql://[^:]+:[^@]+@"

  # NPM/PyPI Tokens
  npm:
    enabled: true
    validity-checks: true

  pypi:
    enabled: true
    validity-checks: true

# AI-Powered Detection (2025)
ai-detection:
  # Enable AI-powered generic password detection
  generic-passwords: true

  # Enable contextual analysis
  contextual-analysis: true

  # Confidence threshold (0.0 - 1.0)
  confidence-threshold: 0.8

  # False positive reduction
  false-positive-reduction: true

  # Extended metadata analysis
  extended-metadata-checks: true

# Alert Configuration
alerts:
  # Create GitHub security alerts for detected secrets
  create-alerts: true

  # Severity level for alerts
  severity: "critical"

  # Automatically dismiss alerts after fix
  auto-dismiss-on-push-fix: true

  # Dismiss delay (days) - wait before auto-dismiss
  dismiss-delay: 7

  # Notification settings
  notifications:
    # Notify code owners
    notify-code-owners: true

    # Notify security team
    notify-security-team: true

    # Notification channels (requires integration)
    channels:
      - "slack"
      - "email"
      - "github-security-tab"

# Secret Remediation Workflow
remediation:
  # Automatic actions on detected secrets
  auto-actions: true

  # Actions to take:
  # 1. Invalidate the secret (API-based for supported providers)
  # 2. Create security advisory
  # 3. Notify secret holder
  # 4. Create incident ticket

  invalidate-secret: true

  create-advisory: true

  notify-user: true

  create-incident:
    enabled: true
    system: "jira"  # or "azure-devops"
    project: "SECURITY"
    issue-type: "Security Incident"
    priority: "P1"

# Advanced Settings
advanced:
  # Enable incremental scanning (faster updates)
  incremental-scanning: true

  # Cache previous results
  cache-results: true

  # Parallelization
  parallel-scans: true

  # Timeout for scanning (seconds)
  timeout: 300

# Exclusion Policies
# Define what should NOT be scanned
exclusions:
  # File patterns to ignore
  file-patterns:
    - "*.min.js"
    - "*.bundle.js"
    - "*.dist.js"
    - "*.gz"
    - "*.zip"

  # Branch patterns to ignore
  branch-patterns:
    - "dependabot/**"  # Dependabot auto-generated branches

  # User exclusions (if legitimate secrets in specific accounts)
  users: []

  # Path-based exclusions with justification
  paths-with-exceptions:
    - path: "docs/api-documentation/"
      reason: "Contains documentation of API response formats with fake credentials"
      expires: "2026-11-09"

    - path: "testing/integration-tests/"
      reason: "Test fixtures with mock credentials"
      expires: "2026-11-09"

# Reporting and Compliance
reporting:
  # Enable secret scanning metrics
  metrics: true

  # Track detection trends
  trend-analysis: true

  # Compliance reporting
  compliance:
    enabled: true
    frameworks:
      - "SOC2"
      - "ISO27001"
      - "GDPR"

  # Regular audit reports
  audit-frequency: "monthly"

  # Export findings
  export:
    format: "json"
    enabled: true

# Integration with Third-Party Tools
integrations:
  # Slack Integration
  slack:
    enabled: true
    webhook: "${SLACK_WEBHOOK_URL}"
    channel: "#security-alerts"
    mention-on-critical: true

  # Jira Integration
  jira:
    enabled: true
    url: "${JIRA_URL}"
    project: "SECURITY"

  # Email Notifications
  email:
    enabled: true
    recipients:
      - "security@example.com"
      - "devops@example.com"

  # Webhook for custom integration
  webhook:
    enabled: false
    url: "${CUSTOM_WEBHOOK_URL}"
    events:
      - "secret.detected"
      - "secret.resolved"
      - "push.blocked"

# Audit and Logging
audit:
  # Log all secret scanning activities
  enabled: true

  # Log retention (days)
  retention: 365

  # Include in security logs
  security-logging: true

  # Export audit logs
  export-logs: true

# Version Control
version: 2025.1
last-updated: "2025-11-09"
maintained-by: "security-team@example.com"

---
# IMPLEMENTATION NOTES:
#
# 1. PUSH PROTECTION:
#    - Blocks commits with detected secrets
#    - Requires bypass approval from designated reviewers
#    - Maintains audit trail of all bypasses
#
# 2. CUSTOM PATTERNS:
#    - Use extended metadata checks for context (2025)
#    - Validity checks reduce false positives
#    - Organization and repo-level customization
#
# 3. AI DETECTION (2025):
#    - Detects generic passwords with ML model
#    - Contextual analysis for accuracy
#    - Significantly reduced false positives vs 2024
#
# 4. PROVIDER COVERAGE:
#    - 45+ token types with validity checks
#    - Extended metadata for 30+ providers
#    - Automatic invalidation for supported providers
#
# 5. WORKFLOW INTEGRATION:
#    - Works with GitHub Actions
#    - Slack/Jira integration for notifications
#    - Automatic remediation where applicable
#
# 6. EXCLUSIONS:
#    - Only for legitimate test/example credentials
#    - Must be documented with expiration dates
#    - Regular review and cleanup required
